<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<style>
:root,[data-theme=light]{--bg:#e8edf2;--panel:#f7f9fb;--ink:#1b2a3b;--given:#1b2a3b;--user:#0f6f7e;--line:#9fb0c2;--thick:#1b2a3b;--sel:#bfe3e8;--rel:#dbe6ee;--same:#a9d6dd;--cage:#6b7f93;--bad:#c23b2e;--badbg:#f6d5d1;--muted:#5d6f82}
[data-theme=dark]{--bg:#141c25;--panel:#1c2733;--ink:#e6edf4;--given:#e6edf4;--user:#6cc7d6;--line:#3d4e60;--thick:#9fb0c2;--sel:#27505a;--rel:#243342;--same:#2f6270;--cage:#8fa2b5;--bad:#ff8b7e;--badbg:#4a2a28;--muted:#8fa2b5}
[data-theme=sage]{--bg:#e6ece3;--panel:#f6f8f3;--ink:#243024;--given:#243024;--user:#3d7a3a;--line:#a5b59f;--thick:#243024;--sel:#cfe6c4;--rel:#e0ebd9;--same:#b5d9a8;--cage:#6f8a68;--bad:#b3382c;--badbg:#f4d6d0;--muted:#5c6e58}
[data-theme=rose]{--bg:#f3e6ea;--panel:#fdf6f8;--ink:#3a1f2b;--given:#3a1f2b;--user:#b0325f;--line:#cfa9b8;--thick:#3a1f2b;--sel:#f4c6d8;--rel:#f6dde6;--same:#efb3cc;--cage:#a06a82;--bad:#c0392b;--badbg:#f8d3cf;--muted:#7a5565}
[data-theme=midnight]{--bg:#0f1a2b;--panel:#172640;--ink:#e3ecff;--given:#e3ecff;--user:#ffd166;--line:#34507a;--thick:#8fb0e8;--sel:#2b4f86;--rel:#1f3454;--same:#35609a;--cage:#7f9ccc;--bad:#ff8b7e;--badbg:#4a2a38;--muted:#8fa6cc}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;display:flex;justify-content:center;padding:16px}
#layout{display:grid;column-gap:20px;align-items:start;justify-content:center;width:100%;max-width:460px;position:relative;
  grid-template-columns:minmax(0,460px);grid-template-areas:"head" "board" "left" "side"}
#head{grid-area:head;min-width:0}
#stage{grid-area:board;min-width:0}
#controls{grid-area:left;min-width:0}
#theme{padding:4px 8px;font-size:.85rem}
.nav{color:var(--user);text-decoration:none;font-size:.9rem}
.nav:hover{text-decoration:underline}
#side{grid-area:side;display:flex;flex-direction:column;gap:14px;margin-top:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h2{margin:0 0 10px;font-size:1.05rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 span{display:flex;gap:6px}
.panel h2 button{padding:3px 8px;font-size:.8rem}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{padding:6px 0;letter-spacing:.15em;font-size:1.05rem;font-weight:700;color:var(--user);background:var(--bg)}
.chip.x{text-decoration:line-through;opacity:.4}
.chip.off{opacity:.3}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.sumrow:last-child{border-bottom:0}
.sumrow .big{font-size:1.4rem;color:var(--user)}
.cgblock{margin-bottom:12px}
.cgblock:last-child{margin-bottom:0}
.bw{position:relative}
.gear{padding:2px 8px;font-size:1.05rem;line-height:1.2}
.settings{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.settings label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.95rem}
.settings select{padding:4px 8px;font-size:.9rem}
.settings input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--user)}
.mods{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.mods .dl{color:var(--muted);font-size:.85rem;margin-right:2px}
.mods button{flex:1;min-width:0;padding:6px 8px;font-size:.9rem}
.mods button[aria-pressed=true]{background:var(--user);color:var(--panel);border-color:var(--user)}
.digits{display:flex;align-items:center;gap:4px;margin-top:10px}
.digits .dl{color:var(--muted);font-size:.85rem;margin-right:4px}
.digits button{flex:1;min-width:0;padding:6px 0;font-size:.95rem}
.digits button.on{background:var(--user);color:var(--panel);border-color:var(--user)}
.digits button.done{opacity:.35}
#dots{position:absolute;inset:3px;pointer-events:none}
.dot{position:absolute;width:clamp(11px,3.2vw,16px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:2px solid #2b2b2b}
.dot.b{background:#111;border-color:#9aa5b1}
#rule{margin:0 0 10px}
.meta{color:var(--muted);margin:0 0 8px;font-size:.9rem}
.calcIn{display:flex;gap:8px;margin-bottom:10px}
.calcIn input{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.cg.on{border-style:solid}
.cg.on.t{border-top-color:var(--user)}.cg.on.b{border-bottom-color:var(--user)}.cg.on.l{border-left-color:var(--user)}.cg.on.r{border-right-color:var(--user)}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.6rem;margin:0;letter-spacing:.02em}
#timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:1.1rem}
.bar{display:flex;gap:8px;margin-bottom:12px}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:hover:not(:disabled),select:hover{border-color:var(--thick)}
:focus-visible{outline:3px solid var(--user);outline-offset:1px}
.bar button{flex:1}
#board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:100%;aspect-ratio:1;background:var(--panel);border:3px solid var(--thick);touch-action:none;user-select:none}
.c{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;padding:0;background:transparent;font-size:clamp(1.2rem,6vw,1.9rem);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--user)}
.c:nth-child(9n){border-right:0}
.c:nth-child(n+73){border-bottom:0}
.c:nth-child(3n):not(:nth-child(9n)){border-right:2px solid var(--thick)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--thick)}
.c.g{color:var(--given);font-weight:700}
.c.r{background:var(--rel)}
.c.s2{background:var(--same)}
.c.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--user)}
.c.hs{background:rgba(224,161,0,.3)}
.c.ht{box-shadow:inset 0 0 0 3px #e0a100}
#msg.hint{color:var(--ink)}
.c.bad{color:var(--bad);background:var(--badbg)}
.notes{pointer-events:none;position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(.5rem,2.4vw,.75rem);color:var(--muted);line-height:1;padding:2px}
.notes span{display:flex;align-items:center;justify-content:center;border-radius:3px}
.k .notes{padding:4px 4px 3px;font-size:clamp(.5rem,2.1vw,.66rem)}
.k .notes.lab{padding:11px 4px 2px}
.cg{position:absolute;inset:2px;pointer-events:none;border:1px dashed transparent}
.cg.t{border-top-color:var(--cage)}.cg.b{border-bottom-color:var(--cage)}.cg.l{border-left-color:var(--cage)}.cg.r{border-right-color:var(--cage)}
.sum{position:absolute;top:2px;left:3px;font-size:clamp(.58rem,2.4vw,.74rem);line-height:1;font-weight:600;color:var(--muted);pointer-events:none}
.notes span.hl{background:var(--user);color:var(--panel);font-weight:700}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:14px}
#pad button{padding:10px 0;font-size:1.3rem}
#pad button.done{opacity:.3}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1}
.tools button[aria-pressed=true]{background:var(--user);color:var(--panel);border-color:var(--user)}
#msg{min-height:1.5em;margin:12px 0 0;text-align:center;color:var(--muted)}
#msg.win{color:var(--user);font-weight:700}
.sr{position:absolute;left:-9999px}
/* medium screens: Killer panels sit to the right of the board */
@media(min-width:820px){
  #layout.k{max-width:780px;grid-template-columns:minmax(0,460px) 290px;grid-template-areas:"head side" "board side" "left side"}
  #layout.k #side{margin-top:0}
}
/* wide screens: controls on the left of the board, board stays centred, Killer panels on the right */
@media(min-width:1100px){
  #layout,#layout.k{max-width:1320px;grid-template-columns:minmax(0,1fr) 460px minmax(0,1fr);grid-template-areas:". head side" "left board side"}
  #controls{justify-self:end;width:250px}
  #pad{grid-template-columns:repeat(3,1fr);margin-top:0}
  #pad button{padding:16px 0;font-size:1.5rem}
  .tools{flex-wrap:wrap}
  .tools button{flex:1 1 calc(50% - 4px)}
  #side,#layout.k #side{position:absolute;width:290px;margin-top:0;top:0;left:0}
}
/* with a keyboard and mouse the on-screen pad and buttons are not needed (keys 1-9, C, F, H, Backspace) */
@media(hover:hover) and (pointer:fine){#controls{display:none}}
</style>
</head>
<body>
<div id="layout">
<div id="head">
  <header><h1 id="title">Sudoku</h1><a class="nav" href="takuzu.html">Takuzu &rarr;</a><select id="theme" aria-label="Palette">
    <option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option>
    <option value="sage">Sage</option><option value="rose">Rose</option><option value="midnight">Midnight</option>
  </select><button id="gear" class="gear" aria-label="Settings" aria-expanded="false" title="Settings">&#9881;</button><span id="timer" aria-label="Elapsed time">0:00</span></header>
  <section id="settings" class="settings" hidden>
    <label>Auto-fill notes
      <select id="setFill"><option value="off">Off</option><option value="all">All digits 1-9</option><option value="valid">Valid digits only</option></select>
    </label>
    <label>Auto-remove notes when a digit is placed <input type="checkbox" id="setRemove"></label>
  </section>
  <div class="bar">
    <select id="diff" aria-label="Difficulty">
      <option value="1">Easy</option>
      <option value="2" selected>Medium</option>
      <option value="3">Hard</option>
      <option value="4">Expert</option>
      <option value="5">Extreme</option>
      <option value="6">Insane</option>
      <option value="7">Nightmare</option>
    </select>
    <button id="new">New game</button>
    <button id="check">Check</button>
  </div>
  <div class="mods" id="mods" role="group" aria-label="Variants">
    <span class="dl">Variants</span>
    <button data-m="knight" aria-pressed="false">Knight</button>
    <button data-m="king" aria-pressed="false">King</button>
    <button data-m="killer" aria-pressed="false">Killer</button>
    <button data-m="kropki" aria-pressed="false">Kropki</button>
  </div>
  <p id="rule" class="meta" hidden></p>
</div>
<main id="stage">
  <div class="bw"><div id="board" role="grid" aria-label="Sudoku board"></div><div id="dots" aria-hidden="true"></div></div>
  <div class="digits" id="digitBar" aria-label="Highlight a digit"></div>
  <div class="tools" id="undoBar">
    <button id="undo" title="Undo (Backspace or Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
  </div>
  <p id="msg" role="status"></p>
</main>
<section id="controls">
  <div id="pad"></div>
  <div class="tools">
    <button id="erase" title="Clear cells (C)">Erase</button>
    <button id="fill" title="Fill notes (F)">Fill notes</button>
    <button id="hint" title="Hint (H); press again to place it">Hint</button>
  </div>
</section>
<aside id="side" hidden>
  <section class="panel">
    <h2>Combinations <span><button id="comboHide">Hide</button><button id="comboReset">Reset</button></span></h2>
    <div id="comboBody"></div>
  </section>
  <section class="panel">
    <h2>Selection sum</h2>
    <div id="sumBody"></div>
  </section>
  <section class="panel">
    <h2>Calculator <button id="calcReset">Reset</button></h2>
    <div class="calcIn">
      <input id="calcSum" type="number" min="1" max="45" inputmode="numeric" placeholder="Sum" aria-label="Cage sum">
      <input id="calcSize" type="number" min="1" max="9" inputmode="numeric" placeholder="Size" aria-label="Cage size">
    </div>
    <div id="calcBody"></div>
  </section>
</aside>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), msgEl = $('msg'), timerEl = $('timer');
  let sol, given, cur, notes, undo = [], redo = [], struck = {}, focusDigit = 0, hintState = null, sel = -1, multi = new Set(), dragging = false, secs = 0, tick = null, won = false;

  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const row = i => Math.floor(i / 9), col = i => i % 9;
  const box = i => Math.floor(row(i) / 3) * 3 + Math.floor(col(i) / 3);
  // Variants. Knight: a chess knight's move apart can't share a digit. King: touching cells
  // (diagonals included) can't share one. Killer: cages must add up to their sum, no repeats inside.
  // A game can combine variants: `mode` is 'classic' or a '+' joined list such as 'knight+king' or 'killer+kropki'.
  let mode = 'classic', cages = null, cageOf = null, dots = null, dotsNeg = true, budget = Infinity;
  const ORDER = ['knight', 'king', 'killer', 'kropki'];
  const parts = m => m === 'classic' ? [] : m.split('+');
  const has = k => parts(mode).includes(k);
  const buildPeers = (m, cg) => {
    const own = Array(81).fill(-1), ms = parts(m);
    if (cg) cg.forEach((c, k) => c.cells.forEach(i => own[i] = k));
    return Array.from({ length: 81 }, (_, i) => {
      const out = [];
      for (let j = 0; j < 81; j++) {
        if (j === i) continue;
        const dr = Math.abs(row(j) - row(i)), dc = Math.abs(col(j) - col(i));
        if (row(j) === row(i) || col(j) === col(i) || box(j) === box(i) ||
            (ms.includes('knight') && dr * dc === 2) || (ms.includes('king') && dr <= 1 && dc <= 1) ||
            (own[i] >= 0 && own[j] === own[i])) out.push(j);
      }
      return out;
    });
  };
  let PEERS = buildPeers('classic', null);
  const RULES = {
    knight: "Knight: cells a chess knight's move apart can't hold the same digit.",
    king: "King: cells that touch, even diagonally, can't hold the same digit.",
    killer: 'Killer: each cage adds up to its small number, with no repeats inside it.',
    kropki: 'Kropki: white dot = consecutive digits, black dot = one is double the other.'
  };
  const ruleText = m => parts(m).map(k => k === 'kropki' ? RULES.kropki + (dotsNeg ? ' No dot = neither.' : ' A missing dot tells you nothing.') : RULES[k]).join(' ');
  const refreshRule = () => { const t = ruleText(mode); $('rule').textContent = t; $('rule').hidden = !t; };
  const TITLES = { knight: 'Knight Sudoku', king: 'King Sudoku', killer: 'Killer Sudoku', kropki: 'Kropki Sudoku' };
  // Insane and Nightmare are only offered with a variant: that is where the generator can actually reach them.
  const syncLevels = m => {
    const any = parts(m).length > 0;
    [...$('diff').options].filter(o => +o.value >= 6).forEach(o => { o.hidden = o.disabled = !any; });
    if (!any && +$('diff').value >= 6) $('diff').value = '5';
  };
  const selectedKey = () => ORDER.filter(k => $('mods').querySelector('[data-m="' + k + '"]').getAttribute('aria-pressed') === 'true').join('+') || 'classic';
  const setMode = m => {
    mode = m; cages = null; cageOf = null; dots = null; PEERS = buildPeers(m, null);
    const ps = parts(m);
    dotsNeg = true; refreshRule();
    syncLevels(m);
    document.querySelectorAll('#mods button').forEach(b => b.setAttribute('aria-pressed', ps.includes(b.dataset.m)));
    $('title').textContent = ps.length === 0 ? 'Sudoku' : ps.length === 1 ? TITLES[ps[0]] : 'Mixed Sudoku';
    $('board').classList.toggle('k', has('killer'));
  };
  // All sets of `size` different digits that add up to `sum`.
  const combos = (sum, size) => {
    const out = [];
    const rec = (start, left, rest, acc) => {
      if (!left) { if (!rest) out.push(acc); return; }
      for (let d = start; d <= 9 && d <= rest; d++) rec(d + 1, left - 1, rest - d, acc + d);
    };
    rec(1, size, sum, '');
    return out;
  };
  const applyCages = cg => {
    cages = cg; cageOf = Array(81).fill(-1);
    // masks: each possible digit set for the cage, as a bitmask (4+4 for 8 is never in the list)
    cg.forEach((c, k) => { c.cells.forEach(i => cageOf[i] = k); c.masks = combos(c.sum, c.cells.length).map(str => [...str].reduce((m, d) => m | 1 << d, 0)); });
    PEERS = buildPeers(mode, cg);
  };
  const orth = c => [row(c) > 0 && c - 9, row(c) < 8 && c + 9, col(c) > 0 && c - 1, col(c) < 8 && c + 1].filter(n => n !== false);
  const NB = Array.from({ length: 81 }, (_, i) => orth(i));

  // Random cages of orthogonally connected cells with distinct digits in the solution.
  // Harder levels have no single-cell cages (those are just givens); small cages keep the puzzle solvable with few givens.
  const CAGE_SIZES = { 1: [2, 2, 3, 3, 3, 4, 4], 2: [2, 2, 3, 3, 3, 4, 4], 3: [2, 3, 3, 3, 4, 4], 4: [2, 2, 3, 3, 4], 5: [2, 3, 3, 4], 6: [2, 3, 3, 4, 4], 7: [3, 3, 4, 4, 5] };
  function buildCages(full, sizes) {
    const owner = Array(81).fill(-1), out = [];
    for (const st of shuffle([...Array(81).keys()])) {
      if (owner[st] >= 0) continue;
      const cells = [st], size = sizes[rnd(sizes.length)];
      owner[st] = out.length;
      while (cells.length < size) {
        const opts = [];
        for (const c of cells) for (const n of NB[c])
          if (owner[n] < 0 && !cells.some(x => full[x] === full[n]) && !opts.includes(n)) opts.push(n);
        if (!opts.length) break;
        const n = opts[rnd(opts.length)];
        owner[n] = out.length; cells.push(n);
      }
      out.push({ cells, sum: cells.reduce((a, i) => a + full[i], 0) });
    }
    return out;
  }
  // folds single-cell cages into a neighbouring cage when the digits stay different
  function mergeSingles(cg, full) {
    const owner = Array(81).fill(-1);
    cg.forEach((c, k) => c.cells.forEach(i => owner[i] = k));
    cg.forEach((c, k) => {
      if (c.cells.length !== 1) return;
      const i = c.cells[0];
      for (const n of shuffle(NB[i].slice())) {
        const t = cg[owner[n]];
        if (owner[n] !== k && t.cells.length < 6 && !t.cells.some(x => full[x] === full[i])) {
          t.cells.push(i); t.sum += full[i]; owner[i] = owner[n]; c.cells = []; break;
        }
      }
    });
    return cg.filter(c => c.cells.length);
  }
  function makeCages(full, T) {
    const maxSingles = T <= 2 ? 99 : T === 3 ? 2 : 0;
    let best = null;
    for (let t = 0; t < 80; t++) {
      let cg = buildCages(full, CAGE_SIZES[T] || CAGE_SIZES[2]);
      if (T >= 3) cg = mergeSingles(cg, full);
      const singles = cg.filter(c => c.cells.length === 1).length;
      if (!best || singles < best.singles) best = { cg, singles };
      if (singles <= maxSingles) break;
    }
    return best.cg;
  }

  // Kropki: every neighbouring pair is 2 (black: one is double the other), 1 (white: differ by 1) or 0 (no dot).
  // The pair 1-2 is black. A pair has to match its dot exactly, so "no dot" is a rule too.
  const relT = (a, b) => a === 2 * b || b === 2 * a ? 2 : Math.abs(a - b) === 1 ? 1 : 0;
  const edgeT = (i, j) => j === i + 1 ? dots.h[i] : j === i - 1 ? dots.h[j] : j === i + 9 ? dots.v[i] : dots.v[j];
  // dotOK: may v and w sit next to each other across an edge of type e? With dotsNeg an empty edge forbids both relations,
  // without it an empty edge says nothing.
  const dotOK = (v, w, e) => dotsNeg ? relT(v, w) === e : e === 0 ? true : e === 1 ? Math.abs(v - w) === 1 : (v === 2 * w || w === 2 * v);
  const applyDots = (d, neg = true) => { dots = d; dotsNeg = neg; refreshRule(); };
  function makeDots(full) {
    const h = Array(81).fill(0), v = Array(81).fill(0);
    for (let i = 0; i < 81; i++) {
      if (col(i) < 8) h[i] = relT(full[i], full[i + 1]);
      if (row(i) < 8) v[i] = relT(full[i], full[i + 9]);
    }
    return { h, v };
  }
  function updateDots() {
    let html = '';
    if (dots) for (let i = 0; i < 81; i++) {
      const r = row(i), c = col(i);
      if (dots.h[i]) html += '<i class="dot ' + (dots.h[i] === 2 ? 'b' : 'w') + '" style="left:' + (c + 1) * 100 / 9 + '%;top:' + (r + .5) * 100 / 9 + '%"></i>';

  // ---- Killer side panels: cage combinations + calculator ----
  const chips = (list, crossed, fits, k) => list.length
    ? '<div class="chips">' + list.map(c => '<button class="chip' + (crossed.has(c) ? ' x' : '') + (fits && !fits(c) ? ' off' : '') + '" data-c="' + c + '"' + (k !== undefined ? ' data-k="' + k + '"' : '') + '>' + c + '</button>').join('') + '</div>'
    : '<p class="meta">No combinations.</p>';
  // every cage that has at least one selected cell, in board order
  const selCages = () => cageOf ? [...new Set([...multi].map(i => cageOf[i]).filter(k => k >= 0))].sort((a, b) => Math.min(...cages[a].cells) - Math.min(...cages[b].cells)) : [];

  function cageBlock(k) {
    const c = cages[k], placed = c.cells.map(i => cur[i]).filter(Boolean);
    const crossed = struck[k] || (struck[k] = new Set());
    const left = c.cells.length - placed.length, rest = c.sum - placed.reduce((a, b) => a + b, 0);
    const list = combos(c.sum, c.cells.length), fits = cmb => placed.every(d => cmb.includes(d));
    return '<div class="cgblock"><p class="meta">Sum ' + c.sum + ' · ' + c.cells.length + (c.cells.length === 1 ? ' cell' : ' cells') +
      (placed.length && left ? ' · ' + rest + ' left in ' + left + (left === 1 ? ' cell' : ' cells') : '') + '</p>' +
      (list.some(fits) ? '' : '<p class="meta">None of these fit the digits already in the cage.</p>') + chips(list, crossed, fits, k) + '</div>';
  }

  function updateSide() {
    const on = has('killer');
    $('side').hidden = !on; $('layout').classList.toggle('k', on);
    if (!on) return;
    updateSum();
    const ks = selCages();
    if (!ks.length) { $('comboBody').innerHTML = '<p class="meta">Select a cell to see the combinations for its cage.</p>'; return; }
    // combinations only make sense for one cage; the Selection sum panel covers bigger selections
    $('comboBody').innerHTML = ks.length === 1 ? cageBlock(ks[0])
      : '<p class="meta">The selection covers ' + ks.length + ' cages. Select cells of a single cage to see its combinations.</p>';
  }

  // Adds up the cage sums of the selected cells (only cages that are fully selected count).
  function updateSum() {
    const cells = [...multi], body = $('sumBody');
    if (!cells.length) { body.innerHTML = '<p class="meta">Select cells (drag, or Shift/Ctrl-click) to add up their cages.</p>'; return; }
    const per = {};
    cells.forEach(i => { per[cageOf[i]] = (per[cageOf[i]] || 0) + 1; });
    let whole = 0, wholeN = 0, partN = 0, partCells = 0;
    for (const k in per) {
      if (per[k] === cages[k].cells.length) { whole += cages[k].sum; wholeN++; } else { partN++; partCells += per[k]; }
    }
    const set = new Set(cells);
    const inPart = cells.filter(i => per[cageOf[i]] !== cages[cageOf[i]].cells.length);
    const typed = inPart.reduce((a, i) => a + cur[i], 0);   // digits already entered count, solved cage or not
    const isUnit = UNITS.some(u => u.length === cells.length && u.every(i => set.has(i)));
    const r = (a, b, big) => '<div class="sumrow"><span>' + a + '</span><b' + (big ? ' class="big"' : '') + '>' + b + '</b></div>';
    body.innerHTML = r(cells.length === 1 ? '1 cell' : cells.length + ' cells', '') +
      r('Whole cages (' + wholeN + ')', whole) +
      (partN ? r('Digits in partial cages (' + partCells + (partCells === 1 ? ' cell' : ' cells') + ')', typed) : '') +
      r('Total', whole + typed, true) +
      (isUnit ? r('Row / column / box total', 45) + (partN ? r('Partial-cage cells add up to', 45 - whole) + (typed ? r('Still to place there', 45 - whole - typed) : '') : '') : '');
  }
  let calcCrossed = new Set();
  function updateCalc() {
    const sum = +$('calcSum').value, size = +$('calcSize').value;
    $('calcBody').innerHTML = sum > 0 && size >= 1 && size <= 9
      ? chips(combos(sum, size), calcCrossed)
      : '<p class="meta">Enter cage sum and size to see possible combinations.</p>';
  }
  const toggle = (set, c) => set.has(c) ? set.delete(c) : set.add(c);
  $('comboBody').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (b && b.dataset.k !== undefined) { toggle(struck[+b.dataset.k], b.dataset.c); updateSide(); }
  });
  $('comboReset').onclick = () => { const ks = selCages(); if (ks.length === 1) struck[ks[0]] = new Set(); updateSide(); };
  $('comboHide').onclick = e => { const h = $('comboBody').hidden = !$('comboBody').hidden; e.target.textContent = h ? 'Show' : 'Hide'; };
  $('calcBody').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { toggle(calcCrossed, b.dataset.c); updateCalc(); } });
  $('calcSum').oninput = $('calcSize').oninput = () => { calcCrossed = new Set(); updateCalc(); };
  $('calcReset').onclick = () => { $('calcSum').value = ''; $('calcSize').value = ''; calcCrossed = new Set(); updateCalc(); };
  updateCalc();

  // ---- Palette ----
  const dark = matchMedia('(prefers-color-scheme: dark)');
  const applyTheme = t => { document.documentElement.dataset.theme = t === 'auto' ? (dark.matches ? 'dark' : 'light') : t; };
  let theme = 'auto';
  try { theme = localStorage.getItem('sudoku-theme') || 'auto'; } catch (e) {}
  $('theme').value = theme;
  if (!$('theme').value) $('theme').value = theme = 'auto';
  applyTheme(theme);
  $('theme').onchange = e => { try { localStorage.setItem('sudoku-theme', e.target.value); } catch (x) {} applyTheme(e.target.value); };
  dark.addEventListener('change', () => { if ($('theme').value === 'auto') applyTheme('auto'); });

  const targets = () => [...multi].filter(i => !given[i]);
  function place(i, v) { notes[i] = new Set(v ? [v] : []); cur[i] = v; }
  // No notes/value split: a cell holding exactly one note IS that digit.
  function derive() { for (let i = 0; i < 81; i++) if (!given[i]) cur[i] = notes[i].size === 1 ? [...notes[i]][0] : 0; }

  // Undo / redo: snapshots of values and notes, taken around every change.
  const snapshot = () => { derive(); return { cur: cur.slice(), notes: notes.map(x => [...x]) }; };
  const restore = sn => { cur = sn.cur.slice(); notes = sn.notes.map(a => new Set(a)); };
  function commit(before) {
    hintState = null;
    if (JSON.stringify(before) === JSON.stringify(snapshot())) return;
    undo.push(before); if (undo.length > 500) undo.shift();
    redo = [];
  }
  function undoMove() { if (won || !undo.length) return; hintState = null; redo.push(snapshot()); restore(undo.pop()); render(); }
  function redoMove() { if (won || !redo.length) return; hintState = null; undo.push(snapshot()); restore(redo.pop()); render(); }

  // When a cell becomes a value, drop that digit from the notes of the cells it sees. A neighbour left with a
  // single note becomes a value itself, so the clean-up carries on from it. Cells that already hold a value are left alone.
  function prune(start) {
    derive();
    if (!settings.autoRemove) return;
    const q = [...start];
    while (q.length) {
      const i = q.pop(), v = cur[i];
      if (!v) continue;
      for (const j of PEERS[i]) {
        if (given[j] || notes[j].size < 2 || !notes[j].delete(v)) continue;
        if (notes[j].size === 1) { cur[j] = [...notes[j]][0]; q.push(j); }
      }
    }
  }

  // ---- Settings ----
  const SETTINGS_KEY = 'sudoku-settings';
  const settings = { autoFill: 'off', autoRemove: true };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}); } catch (e) {}
  const saveSettings = () => { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} };
  // Auto-fill: put notes into every empty cell that has none. 'all' = 1-9, 'valid' = only digits that fit
  // (cells with a single fitting digit stay empty, otherwise the notes would solve the puzzle).
  function autoFill(how, withUndo) {
    if (how === 'off' || won) return 0;
    derive();
    const before = withUndo ? snapshot() : null;
    let n = 0;
    for (let i = 0; i < 81; i++) {
      if (given[i] || cur[i] || notes[i].size) continue;
      if (how === 'all') { notes[i] = new Set([1, 2, 3, 4, 5, 6, 7, 8, 9]); n++; }
      else { const c = candidates(cur, i); if (c.length >= 2) { notes[i] = new Set(c); n++; } }
    }
    if (withUndo && n) commit(before);
    return n;
  }
  $('setFill').value = settings.autoFill;
  $('setRemove').checked = settings.autoRemove;
  $('setFill').onchange = e => { settings.autoFill = e.target.value; saveSettings(); if (!busy && cur) { autoFill(settings.autoFill, true); render(); } };
  $('setRemove').onchange = e => { settings.autoRemove = e.target.checked; saveSettings(); };
  $('gear').onclick = () => { const open = $('settings').hidden; $('settings').hidden = !open; $('gear').setAttribute('aria-expanded', open); };

  // Digits always go into the cell's notes (toggled). With several cells selected, the digit is added to
  // all of them, or removed from all if they already have it.
  function enter(v) {
    const t = targets();
    if (won || !t.length) return;
    msgEl.textContent = ''; msgEl.className = '';
    const before = snapshot();
    const all = t.every(i => notes[i].has(v));
    t.forEach(i => all ? notes[i].delete(v) : notes[i].add(v));
    derive(); prune(t.filter(i => cur[i] && cur[i] !== before.cur[i]));
    commit(before); render(); checkWin();
  }

  function erase() {
    const t = targets();
    if (won || !t.length) return;
    const before = snapshot();
    t.forEach(i => notes[i].clear());
    commit(before); render();
  }

  // Puts every digit 1-9 into the notes of each empty cell, with no validity check.
  // Cells that already have a value or notes are left alone, so your own eliminations survive.
  function fillNotes() {
    if (won) return;
    const fill = [...Array(81).keys()].filter(i => !given[i] && !cur[i] && !notes[i].size);
    const before = snapshot();
    fill.forEach(i => { notes[i] = new Set([1, 2, 3, 4, 5, 6, 7, 8, 9]); });
    commit(before);
    msgEl.className = '';
    msgEl.textContent = fill.length ? 'Filled ' + fill.length + (fill.length === 1 ? ' cell' : ' cells') + ' with 1-9.' : 'No empty cells to fill.';
    render();
  }

  function checkWin() {
    if (cur.every((v, i) => v === sol[i])) {
      won = true; clearInterval(tick);
      msgEl.textContent = 'Solved in ' + fmt(secs) + '.'; msgEl.className = 'win';
      localStorage.removeItem('sudoku');
    }
  }

  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  function startTimer() {
    clearInterval(tick); timerEl.textContent = fmt(secs);
    tick = setInterval(() => { secs++; timerEl.textContent = fmt(secs); if (secs % 5 === 0) save(); }, 1000);
  }

  function save() {
    if (won) return;
    try {
      localStorage.setItem('sudoku', JSON.stringify({ sol, given, cur, notes: notes.map(s => [...s]), secs, diff: $('diff').value, mode, cages, dots, dotsNeg }));
    } catch (e) {}
  }

  function load(d) {
    ({ sol, given, cur, secs } = d);
    notes = d.notes.map(a => new Set(a));
    cur.forEach((v, i) => { if (v && !given[i] && !notes[i].size) notes[i].add(v); });
    undo = []; redo = []; struck = {};
    $('diff').value = d.diff;
    if (!$('diff').value) $('diff').value = '2';
    setMode(d.mode || (d.knight ? 'knight' : 'classic'));
    if (d.cages) applyCages(d.cages);
    if (d.dots) applyDots(d.dots, d.dotsNeg !== false);
  }

  let busy = false;
  const setBusy = on => {
    busy = on;
    ['stage', 'controls', 'side'].forEach(id => { const el = $(id); if (el) el.inert = on; });
  };
  function newGame() {
    clearInterval(tick);
    setMode(selectedKey());
    const T = +$('diff').value;
    setBusy(true);
    msgEl.className = ''; msgEl.textContent = 'Generating…';
    generateLevelAsync(T, (tries, lv, ms) => {
      if (T >= 4) msgEl.textContent = 'Looking for ' + (/^[AEIOU]/.test(NAMES[T - 1]) ? 'an ' : 'a ') + NAMES[T - 1] + ' puzzle… ' + Math.round(ms / 1000) + ' s (try ' + (tries + 1) + (lv ? ', best so far: ' + NAMES[lv - 1] : '') + ')';
    }, gen => {
      if (has('killer')) applyCages(gen.cages);
      if (has('kropki')) applyDots(gen.dots, gen.dotsNeg);
      sol = gen.full; given = gen.puzzle.map(v => !!v); cur = gen.puzzle.slice();
      notes = Array.from({ length: 81 }, () => new Set());
      sel = -1; multi = new Set(); secs = 0; won = false; undo = []; redo = []; struck = {}; focusDigit = 0; hintState = null;
      setBusy(false);
      autoFill(settings.autoFill);
      msgEl.className = '';
      msgEl.textContent = gen.lv === T ? '' : gen.lv > T ? 'This one turned out harder than asked: ' + NAMES[gen.lv - 1] + '.' : 'Closest match found: ' + NAMES[gen.lv - 1] + '.';
      render(); startTimer();
    });
  }

  $('new').onclick = newGame;
  $('check').onclick = () => {
    if (won) return;
    const wrong = cur.filter((v, i) => v && v !== sol[i]).length;
    msgEl.className = '';
    msgEl.textContent = wrong ? wrong + (wrong === 1 ? ' cell is' : ' cells are') + ' wrong.' : 'No mistakes so far.';
  };
  // ---- Hints: the next move you could really make, with the reason ----
  const cellName = i => 'row ' + (row(i) + 1) + ', column ' + (col(i) + 1);
  const BOXN = ['top left', 'top middle', 'top right', 'middle left', 'centre', 'middle right', 'bottom left', 'bottom middle', 'bottom right'];
  const unitName = (kind, k) => kind === 'row' ? 'row ' + (k + 1) : kind === 'col' ? 'column ' + (k + 1) : 'the ' + BOXN[k] + ' box';

  // Works from the digits on the board only (not your notes): a wrong digit first, then hidden singles
  // (box, row, column), then naked singles. Without any of those it falls back to a digit from the solution.
  function findHint() {
    derive();
    const bad = [...Array(81).keys()].find(i => !given[i] && cur[i] && cur[i] !== sol[i]);
    if (bad !== undefined) return { cell: bad, digit: 0, src: new Set(), ask: 'Press H again to clear it.',
      text: 'Mistake: ' + cellName(bad) + ' holds a ' + cur[bad] + ' that does not belong there. Remove it before going on.' };
    const cand = [];
    for (let i = 0; i < 81; i++) if (!cur[i]) cand[i] = candidates(cur, i);
    const holder = (j, d) => PEERS[j].find(p => cur[p] === d);   // a cell that already rules d out of j
    for (const [kind, off] of [['box', 2], ['row', 0], ['col', 1]]) for (let k = 0; k < 9; k++) {
      const u = UNITS[3 * k + off];
      for (let d = 1; d <= 9; d++) {
        if (u.some(i => cur[i] === d)) continue;
        const cs = u.filter(i => !cur[i] && cand[i].includes(d));
        if (cs.length !== 1) continue;
        const src = new Set(); let other = false;
        u.forEach(j => { if (cur[j] || j === cs[0]) return; const p = holder(j, d); if (p === undefined) other = true; else src.add(p); });
        return { cell: cs[0], digit: d, src, ask: 'Press H again to place it.',
          text: 'In ' + unitName(kind, k) + ' the ' + d + ' has only one place left: ' + cellName(cs[0]) + '. Every other empty cell there already sees a ' + d + ' (highlighted)' + (other ? ' or is ruled out by the variant rules' : '') + '.' };
      }
    }
    for (let i = 0; i < 81; i++) {
      if (cur[i] || cand[i].length !== 1) continue;
      const v = cand[i][0], src = new Set(); let other = false;
      for (let w = 1; w <= 9; w++) { if (w === v) continue; const p = holder(i, w); if (p === undefined) other = true; else src.add(p); }
      return { cell: i, digit: v, src, ask: 'Press H again to place it.',
        text: cellName(i) + ' can only be a ' + v + ': every other digit is already used by a cell it sees (highlighted)' + (other ? ' or is excluded by the variant rules' : '') + '.' };
    }
    const open = [...Array(81).keys()].filter(i => !given[i] && !cur[i]);
    if (!open.length) return null;
    const i = open[rnd(open.length)];
    return { cell: i, digit: sol[i], src: new Set(), ask: 'Press H again to place it.',
      text: 'No simple deduction is left (this needs a more advanced technique or a guess). From the solution: ' + cellName(i) + ' is a ' + sol[i] + '.' };
  }
  function giveHint() {
    if (won) return;
    if (hintState) { applyHint(); return; }          // second press carries the hint out
    const h = findHint();
    if (!h) return;
    hintState = h; sel = h.cell; multi = new Set([h.cell]);
    msgEl.className = 'hint'; msgEl.textContent = h.text + ' ' + h.ask;
    render();
  }
  function applyHint() {
    const h = hintState; hintState = null;
    const before = snapshot();
    if (h.digit) { place(h.cell, h.digit); prune([h.cell]); } else notes[h.cell].clear();
    msgEl.className = ''; msgEl.textContent = '';
    commit(before); render(); checkWin();
  }
  $('hint').onclick = giveHint;
  $('erase').onclick = erase;
  $('mods').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    syncLevels(selectedKey());
  });
  $('undo').onclick = undoMove;
  $('redo').onclick = redoMove;
  $('fill').onclick = fillNotes;

  document.addEventListener('keydown', e => {
    if (busy) return;
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 'z') { e.preventDefault(); e.shiftKey ? redoMove() : undoMove(); return; }
      if (k === 'y') { e.preventDefault(); redoMove(); return; }
    }
    if (busy || /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.shiftKey && /^Digit[1-9]$/.test(e.code)) { const d = +e.code.slice(5); focusDigit = focusDigit === d ? 0 : d; render(); }
    else if (/^[1-9]$/.test(e.key)) enter(+e.key);
    else if (e.key === 'Backspace') { e.preventDefault(); undoMove(); }
    else if (e.key === 'Delete' || e.key === '0' || e.key === 'c' || e.key === 'C') erase();
    else if (e.key === 'h' || e.key === 'H') giveHint();
    else if (e.key === 'f' || e.key === 'F') fillNotes();
    else if (e.key === 'Escape') { sel = -1; multi = new Set(); focusDigit = 0; render(); }
    else if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      if (sel < 0) sel = 0;
      else {
        const r = row(sel), c = col(sel);
        if (e.key === 'ArrowUp') sel = ((r + 8) % 9) * 9 + c;
        if (e.key === 'ArrowDown') sel = ((r + 1) % 9) * 9 + c;
        if (e.key === 'ArrowLeft') sel = r * 9 + (c + 8) % 9;
        if (e.key === 'ArrowRight') sel = r * 9 + (c + 1) % 9;
      }
      multi = e.shiftKey ? new Set([...multi, sel]) : new Set([sel]);
      render(); boardEl.children[sel].focus();
    }
  });

  // Multi-select: shift/ctrl-click to add or remove cells, or drag across cells.
  const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); const c = el && el.closest ? el.closest('.c') : null; return c && boardEl.contains(c) ? +c.dataset.i : -1; };
  boardEl.addEventListener('pointerdown', e => {
    const i = cellAt(e.clientX, e.clientY);
    if (i < 0) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) { multi.has(i) ? multi.delete(i) : multi.add(i); }
    else if (e.shiftKey) multi.add(i);
    else multi = new Set([i]);
    sel = multi.size ? i : -1;
    dragging = true; render();
  });
  document.addEventListener('pointermove', e => {
    if (!dragging) return;
    const i = cellAt(e.clientX, e.clientY);
    if (i >= 0 && !multi.has(i)) { multi.add(i); sel = i; render(); }
  });
  document.addEventListener('pointerup', () => { dragging = false; });
  document.addEventListener('pointercancel', () => { dragging = false; });

  build();
  try {
    const saved = JSON.parse(localStorage.getItem('sudoku'));
    if (saved && saved.cur) { load(saved); won = false; render(); startTimer(); return; }
  } catch (e) {}
  newGame();
})();
</script>
</body>
</html>
